<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Добавление сертификата</title>
  <link th:href="@{/css/list.css}" rel="stylesheet" />

</head>
<style>
  body {
    background-color: #121212;
    color: #ffffff;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }

  .body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  form {
    background-color: #1e1e1e;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 600px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  td {
    padding: 10px;
    vertical-align: top;
  }

  a {
    font-weight: bold;
  }

  input[type="text"],
  input[type="date"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #555;
    border-radius: 4px;
    background-color: #2a2a2a;
    color: #ffffff;
  }

  input::placeholder {
    color: #888;
  }

  button {
    background-color: #007BFF;
    color: #ffffff;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
  }

  button:hover {
    background-color: #0056b3;
  }

  div[style="color: red"] {
    margin-top: 5px;
    font-size: 14px;
  }



  @media (max-width: 768px) {
    td {
      display: block;
      width: 100%;
    }

    table {
      display: block;
    }

    button {
      width: 100%;
    }
  }
</style>
<body class="body">
<form th:action="${'/certificate/add'}" method="post" th:object="${certificate}">
  <table>
    <tr>
      <td>
        <a>Название сертификата: </a>
        <input type="text" th:field="*{certificateName}" name="certificateName" placeholder="Введите название">
        <div style="color: red" th:if="${#fields.hasErrors('certificateName')}" th:errors="*{certificateName}"></div>
      </td>
    </tr>
    <tr>
      <td>
        <a>Дата истечения: </a>
        <input type="date" th:field="*{expirationDate}" name="expirationDate" placeholder="Введите дату">
        <div style="color: red" th:if="${#fields.hasErrors('expirationDate')}" th:errors="*{expirationDate}"></div>
      </td>
    </tr>
  </table>
  <br>
  <button type="submit">Добавить</button>
</form>
</body>
</html>

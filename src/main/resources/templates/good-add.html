<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить товар</title>
    <link th:href="@{/css/list.css}" rel="stylesheet" />
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        form {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 10px;
            vertical-align: top;
        }

        a {
            font-weight: bold;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #2a2a2a;
            color: #ffffff;
        }

        input::placeholder {
            color: #888;
        }

        button {
            background-color: #007BFF;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        div[style="color: red"] {
            margin-top: 5px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            td {
                display: block;
                width: 100%;
            }

            table {
                display: block;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body class="body">

<form th:action="${'/good/add'}" method="post" th:object="${good}">
    <table>
        <tr>
            <td>
                <a>Название товара: </a>
                <input type="text" th:field="*{goodName}" name="goodName" placeholder="Введите название">
                <div style="color: red" th:if="${#fields.hasErrors('goodName')}" th:errors="*{goodName}"></div>
            </td>
            <td>
                <a>Вес товара: </a>
                <input type="text" th:field="*{goodWeight}" name="goodWeight" placeholder="Введите вес">
                <div style="color: red" th:if="${#fields.hasErrors('goodWeight')}" th:errors="*{goodWeight}"></div>
            </td>
            <td>
                <a>Тип товара: </a>
                <select name="goodTypeName" >
                    <option th:each="element : ${goodType}" th:value="${element.getGoodTypeName()}" th:text="${element.getGoodTypeName()}"></option>
                </select>
            </td>
            <td>
                <a>Название материала: </a>
                <select name="materialName" >
                    <option th:each="element : ${material}" th:value="${element.getMaterialName()}" th:text="${element.getMaterialName()}"></option>
                </select>
            </td>
            <td>
                <a>Название сертификата: </a>
                <select name="certificateName" >
                    <option th:each="element : ${certificate}" th:value="${element.getCertificateName()}" th:text="${element.getCertificateName()}"></option>
                </select>
            </td>
        </tr>
    </table>
    <br>
    <button type="submit">Добавить</button>
</form>

</body>
</html>
